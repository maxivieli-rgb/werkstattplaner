<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Reparatur-Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&family=Manrope:wght@400;600;700&display=swap">
<style>
/* Layout: dark branded band on top with the workshop name; the status card overlaps it with a progress ring,
   a compact step bar, the work list as a mini checklist and a sticky contact bar at the bottom. */
:root {
  --bg: #f4f3f0; --card: #ffffff; --fg: #17181b; --muted: #6c6f77; --line: #e6e4df; --soft: #f6f5f2;
  --band: #16171b; --band-fg: #f4f4f5; --band-muted: #a3a6ae;
  --accent: #f0600f; --accent-2: #ff8a3d; --accent-soft: #fff0e6; --good: #1f9d55; --good-soft: #e3f5ea;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Manrope", -apple-system, system-ui, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0f1013; --card: #1b1c21; --fg: #f1f1f3; --muted: #9c9fa8; --line: #2b2d33; --soft: #222329; --band: #0b0b0d; --accent: #ff7a2e; --accent-2: #ffa060; --accent-soft: #3a2316; --good: #43c97b; --good-soft: #14301f; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0f1013; --card: #1b1c21; --fg: #f1f1f3; --muted: #9c9fa8; --line: #2b2d33; --soft: #222329; --band: #0b0b0d; --accent: #ff7a2e; --accent-2: #ffa060; --accent-soft: #3a2316; --good: #43c97b; --good-soft: #14301f; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
.band { background: radial-gradient(120% 140% at 85% -20%, color-mix(in srgb, var(--accent) 45%, transparent), transparent 55%), var(--band); color: var(--band-fg); padding-top: env(safe-area-inset-top, 0px); }
.band .in { max-width: 520px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-block: 22px 74px; display: flex; align-items: center; gap: 12px; }
.logo { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, var(--accent-2), var(--accent)); display: grid; place-items: center; flex: none; box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 45%, transparent); }
.logo svg { width: 24px; height: 24px; color: #fff; }
.band b { display: block; font-size: 1.02rem; font-weight: 700; }
.band small { color: var(--band-muted); font-size: .82rem; letter-spacing: .02em; }
.wrap { max-width: 520px; margin: -58px auto 0; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(110px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; position: relative; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .07); }
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
h1 { font: 600 1.12rem/1.25 var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em; hyphens: none; }
.hero-top > div { min-width: 0; }
.who { color: var(--muted); font-size: .9rem; margin-top: 4px; }
.plate { display: inline-flex; border: 2px solid #1b1b1b; border-radius: 6px; background: #fff; color: #111; font: 700 .92rem/1 "DIN Alternate", "Arial Narrow", Arial, sans-serif; letter-spacing: .06em; overflow: hidden; flex: none; }
.plate i { background: #1446b8; color: #ffd400; font: 700 .5rem/1 Arial, sans-serif; font-style: normal; display: flex; align-items: flex-end; justify-content: center; padding: 3px 3px; width: 16px; }
.plate b { padding: 5px 7px; white-space: nowrap; }
.status { display: grid; grid-template-columns: 92px 1fr; gap: 16px; align-items: center; padding: 14px; border-radius: 18px; background: var(--accent-soft); }
.status.done { background: var(--good-soft); }
.ring { position: relative; width: 92px; height: 92px; }
.ring svg { width: 92px; height: 92px; transform: rotate(-90deg); }
.ring .trk { stroke: color-mix(in srgb, var(--accent) 18%, transparent); }
.status.done .ring .trk { stroke: color-mix(in srgb, var(--good) 20%, transparent); }
.ring .bar { stroke: var(--accent); transition: stroke-dashoffset 1s ease; }
.status.done .ring .bar { stroke: var(--good); }
.ring .ic { position: absolute; inset: 0; display: grid; place-items: center; color: var(--accent); }
.status.done .ring .ic { color: var(--good); }
.ring .ic svg { width: 34px; height: 34px; transform: none; }
.st-t { font: 600 1.12rem/1.25 var(--display); }
.st-d { color: var(--muted); font-size: .9rem; margin-top: 4px; }
.eta { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 6px 10px; border-radius: 999px; background: var(--card); font-size: .82rem; font-weight: 700; }
.eta svg { width: 15px; height: 15px; color: var(--accent); }
.steps { display: grid; gap: 4px; }
.steps .dots { display: flex; align-items: center; }
.steps .d { width: 12px; height: 12px; border-radius: 50%; background: var(--line); flex: none; }
.steps .l { flex: 1; height: 3px; background: var(--line); }
.steps .d.ok, .steps .l.ok { background: var(--good); }
.steps .d.cur { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
.steps .labels { display: flex; justify-content: space-between; font-size: .7rem; color: var(--muted); font-weight: 600; }
.steps .labels span { flex: 1; text-align: center; } .steps .labels span:first-child { text-align: left; } .steps .labels span:last-child { text-align: right; }
.steps .labels .on { color: var(--fg); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fact { background: var(--soft); border-radius: 14px; padding: 10px 12px; }
.fact span { display: block; font-size: .74rem; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.fact b { font-size: 1rem; font-variant-numeric: tabular-nums; }
.fact.money b { color: var(--accent); }
.facts .fact:only-child { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; }
h2 { margin: 0; font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.pbar { height: 6px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.pbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--good), color-mix(in srgb, var(--good) 70%, #fff)); border-radius: inherit; }
.jobs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.jobs li { display: flex; gap: 10px; align-items: flex-start; font-size: .95rem; }
.jobs .c { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex: none; margin-top: 1px; display: grid; place-items: center; }
.jobs .c svg { width: 12px; height: 12px; color: #fff; }
.jobs .y .c { background: var(--good); border-color: var(--good); }
.jobs .y span { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 50%, transparent); }
.dock { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
.dock .in { max-width: 520px; margin: 0 auto; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; align-items: center; }
.dock .q { flex: 1; font-size: .8rem; color: var(--muted); line-height: 1.3; min-width: 0; }
.dock .q b { color: var(--fg); display: block; font-size: .9rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; font-weight: 700; font-size: .92rem; padding: 12px 14px; border-radius: 14px; background: var(--accent); color: #fff; flex: none; }
.btn.ghost { background: var(--soft); color: var(--fg); }
.btn svg { width: 18px; height: 18px; }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.foot { color: var(--muted); font-size: .76rem; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; }
.live { width: 7px; height: 7px; border-radius: 50%; background: var(--good); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.empty { text-align: center; color: var(--muted); padding: 40px 18px; background: var(--card); border-radius: 22px; border: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { .live { animation: none; } .ring .bar { transition: none; } }
</style>
</head>
<body>
<header class="band"><div class="in"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span><div><b id="shop">Ihre Werkstatt</b><small>Reparatur-Status</small></div></div></header>
<main class="wrap" id="app"><div class="empty">Status wird geladen …</div></main>
<div id="dock"></div>
<script>
(function () {
  "use strict";
  const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const eur = (n) => Number(n).toLocaleString("de-DE", { style: "currency", currency: "EUR" });
  const dDe = (iso) => { const d = new Date(iso + "T12:00"); return isNaN(d) ? "" : d.toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "short" }); };
  const unb64 = (b) => { b = b.replace(/-/g, "+").replace(/_/g, "/"); while (b.length % 4) b += "="; const bin = atob(b), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
  // fester Link: #<id>.<schlüssel> -> verschlüsselter Stand aus s/<id>.json
  let live = null, timer = null;
  async function loadLive() {
    const [, id, k] = live;
    const r = await fetch(`s/${id}.json?t=${Date.now()}`, { cache: "no-store" });
    if (r.status === 404) return { pending: true };
    if (!r.ok) throw new Error("http " + r.status);
    const j = await r.json();
    const key = await crypto.subtle.importKey("raw", unb64(k), "AES-GCM", false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(j.iv) }, key, unb64(j.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function decode() {
    const h = location.hash.replace(/^#/, "");
    live = /^([a-z0-9]{8,12})\.([A-Za-z0-9_-]{20,})$/.exec(h);
    if (live) {
      try { const d = await loadLive(); if (d && d.pending) return d; if (d && d.v === 2 && d.u) d.u = d.u * 60000; if (d && Array.isArray(d.ar)) d.ar = d.ar.map(([t, ok]) => [t, !!ok]); if (d) d.live = true; return d; }
      catch { return { error: true }; }
    }
    try {
      let bytes;
      if (/^z[A-Za-z0-9_-]+$/.test(h)) {
        const zs = new Blob([unb64(h.slice(1))]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
        bytes = new Uint8Array(await new Response(zs).arrayBuffer());
      } else if (/^j[A-Za-z0-9_-]+$/.test(h)) bytes = unb64(h.slice(1));
      else { const m = /(?:^|&)d=([A-Za-z0-9_-]+)/.exec(h); if (!m) return null; bytes = unb64(m[1]); }
      const d = JSON.parse(new TextDecoder().decode(bytes));
      if (d && d.v === 2 && d.u) d.u = d.u * 60000;
      if (d && Array.isArray(d.ar)) d.ar = d.ar.map(([t, ok]) => [t, !!ok]);
      return d;
    } catch { return null; }
  }
  const IC = {
    neu: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
    teile: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/>',
    arbeit: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
    fertig: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.5 9"/>',
    erledigt: '<path d="M20 6L9 17l-5-5"/>',
  };
  const svg = (p, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const STEPS = [
    ["neu", "Angenommen", "Auto angenommen", "Wir haben Ihr Auto und schauen es uns an."],
    ["teile", "Teile", "Teile bestellt", "Wir warten auf die Ersatzteile."],
    ["arbeit", "Werkstatt", "In der Werkstatt", "Wir arbeiten gerade an Ihrem Auto."],
    ["fertig", "Fertig", "Fertig zur Abholung", "Ihr Auto ist fertig und kann abgeholt werden."],
    ["erledigt", "Abgeholt", "Abgeholt", "Vielen Dank für Ihren Auftrag!"],
  ];
  function render(d) {
    const app = document.getElementById("app"), dock = document.getElementById("dock");
    if (d && d.w) { document.getElementById("shop").textContent = d.w; document.title = "Reparatur-Status · " + d.w; }
    const box = (t) => { app.innerHTML = `<div class="empty">${t}</div>`; dock.innerHTML = ""; };
    if (d && d.pending) return box("Ihr Reparatur-Status wird gerade vorbereitet.<br>Die Seite lädt sich in einer Minute von selbst neu.");
    if (d && d.error) return box("Der Status konnte gerade nicht geladen werden.<br>Die Seite versucht es gleich nochmal.");
    if (!d) return box("Dieser Status-Link ist unvollständig.<br>Bitte fragen Sie Ihre Werkstatt nach einem neuen Link.");
    const st = d.s || "neu";
    const steps = STEPS.filter(([k]) => k !== "teile" || st === "teile" || d.tp);
    let idx = steps.findIndex((x) => x[0] === st); if (idx < 0) idx = 0;
    const done = st === "fertig" || st === "erledigt";
    const pct = st === "erledigt" ? 1 : (idx + (done ? 1 : 0.5)) / steps.length;
    const C = 2 * Math.PI * 40;
    const cur = steps[idx];
    const ar = Array.isArray(d.ar) ? d.ar : [];
    const doneN = ar.filter((x) => x[1]).length;
    const plate = d.z ? `<span class="plate"><i>D</i><b>${esc(d.z)}</b></span>` : "";
    const facts = [];
    if (d.f && !done) facts.push(`<div class="fact"><span>Voraussichtlich fertig</span><b>${esc(dDe(d.f))}</b></div>`);
    if (d.tp && !done) facts.push(`<div class="fact"><span>Ersatzteile</span><b>${d.tp[0]} von ${d.tp[1]} da</b></div>`);
    if (d.o > 0 && done) facts.push(`<div class="fact money"><span>${st === "fertig" ? "Bei Abholung" : "Noch offen"}</span><b>${eur(d.o)}</b></div>`);
    const h = [];
    h.push(`<section class="card">
      <div class="hero-top"><div><h1>${esc(d.a || "Ihr Auto")}</h1>${d.k ? `<div class="who">${esc(d.k)}</div>` : ""}</div>${plate}</div>
      <div class="status${done ? " done" : ""}">
        <div class="ring"><svg viewBox="0 0 92 92" aria-hidden="true"><circle class="trk" cx="46" cy="46" r="40" fill="none" stroke-width="8"/><circle class="bar" cx="46" cy="46" r="40" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/></svg><span class="ic">${svg(IC[cur[0]] || IC.arbeit, 1.9)}</span></div>
        <div><div class="st-t">${esc(cur[2])}</div><div class="st-d">${esc(cur[3])}</div></div>
      </div>
      <div class="steps" aria-label="Fortschritt"><div class="dots">${steps.map((x, i) => (i ? `<span class="l${i <= idx ? " ok" : ""}"></span>` : "") + `<span class="d${i < idx || st === "erledigt" || (done && i === idx) ? " ok" : i === idx ? " cur" : ""}"></span>`).join("")}</div>
        <div class="labels">${steps.map((x, i) => `<span class="${i === idx ? "on" : ""}">${esc(x[1])}</span>`).join("")}</div></div>
      ${facts.length ? `<div class="facts">${facts.join("")}</div>` : ""}
    </section>`);
    if (ar.length) h.push(`<section class="card"><h2><span>Arbeiten</span><span>${Math.round((doneN / ar.length) * 100)} %</span></h2><div class="pbar"><i style="width:${(doneN / ar.length) * 100}%"></i></div>
      <ul class="jobs">${ar.map(([t, ok]) => `<li class="${ok ? "y" : "n"}"><span class="c" aria-hidden="true">${ok ? svg('<path d="M20 6L9 17l-5-5"/>', 3.2) : ""}</span><span>${esc(t)}</span></li>`).join("")}</ul></section>`);
    if (d.u) { const t = new Date(d.u); h.push(`<div class="foot">${d.live ? '<span class="live" aria-hidden="true"></span>Aktualisiert sich automatisch · ' : ""}Stand ${t.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })}, ${t.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })} Uhr</div>`); }
    app.innerHTML = h.join("");
    if (d.t) {
      const tel = String(d.t).replace(/[^\d+]/g, "");
      const wa = tel.replace(/^\+/, "").replace(/^00/, "").replace(/^0/, "49");
      dock.innerHTML = `<div class="dock"><div class="in"><div class="q"><b>Fragen?</b>${esc(d.t)}</div>
        <a class="btn ghost" href="tel:${tel}" aria-label="Anrufen">${svg('<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>')}</a>
        <a class="btn" href="https://wa.me/${wa}">${svg('<path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2.1-5.6A8.4 8.4 0 1 1 21 11.5z"/>')}WhatsApp</a></div></div>`;
    } else dock.innerHTML = "";
  }
  const go = async () => {
    render(await decode());
    clearTimeout(timer);
    if (live) timer = setTimeout(function again() { if (document.visibilityState === "visible") go(); else timer = setTimeout(again, 60000); }, 60000);
  };
  go(); addEventListener("hashchange", go);
  document.addEventListener("visibilitychange", () => { if (live && document.visibilityState === "visible") go(); });
})();
</script>
</body>
</html>
